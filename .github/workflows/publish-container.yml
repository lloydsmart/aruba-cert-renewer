name: Publish release container

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify release container
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      image_id: ${{ steps.candidate.outputs.image_id }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      CANDIDATE_IMAGE: aruba-cert-renewer:release-candidate
      IS_GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            printf '%s\n' 'Expected vMAJOR.MINOR.PATCH with an optional -SUFFIX; build metadata is not supported.' >&2
            exit 1
          fi

          publish_latest=true
          if [[ "$IS_GITHUB_PRERELEASE" == 'true' || "$RELEASE_TAG" == *-* ]]; then
            publish_latest=false
          fi

          {
            printf 'artifact_name=aruba-cert-renewer-%s-candidate\n' \
              "$RELEASE_TAG"
            printf 'publish_latest=%s\n' "$publish_latest"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          commit_sha=$(git rev-parse HEAD)
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Resolved release commit is not a full lowercase SHA: %s\n' "$commit_sha" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            printf '%s\n' 'Remote main ref is unavailable; cannot validate the release commit.' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            printf 'Release commit %s is not part of main history.\n' "$commit_sha" >&2
            printf '%s\n' 'Release commits must already belong to main before publication.' >&2
            exit 1
          fi

          printf 'sha=%s\n' "$commit_sha" >>"$GITHUB_OUTPUT"

      - name: Build and smoke-test release candidate
        run: tests/container-smoke.sh "$CANDIDATE_IMAGE"

      - name: Scan release candidate for vulnerabilities
        run: ./scripts/scan-container.sh "$CANDIDATE_IMAGE"

      - name: Generate release SPDX JSON SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.CANDIDATE_IMAGE }}
          format: spdx-json
          output-file: release-sbom.spdx.json
          artifact-name: aruba-cert-renewer-${{ env.RELEASE_TAG }}-sbom.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: true
          upload-release-assets: false

      - name: Export verified release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          tested_image_id=$(docker image inspect --format '{{.Id}}' \
            "$CANDIDATE_IMAGE")
          if [[ ! "$tested_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Unexpected tested image ID: %s\n' "$tested_image_id" >&2
            exit 1
          fi

          if [[ ! -s release-sbom.spdx.json ]]; then
            printf '%s\n' 'The generated release SBOM is missing or empty.' >&2
            exit 1
          fi

          handoff_directory="$RUNNER_TEMP/release-candidate"
          mkdir -- "$handoff_directory"

          docker image save \
            --output "$handoff_directory/release-candidate.tar" \
            "$CANDIDATE_IMAGE"

          (
            cd "$handoff_directory"
            sha256sum release-candidate.tar \
              >release-candidate.tar.sha256
          )

          printf '%s\n' "$tested_image_id" \
            >"$handoff_directory/tested-image-id.txt"
          cp -- release-sbom.spdx.json \
            "$handoff_directory/release-sbom.spdx.json"

          printf 'image_id=%s\n' "$tested_image_id" >>"$GITHUB_OUTPUT"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified release container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      CANDIDATE_ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
      COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
      IMAGE_NAME: ghcr.io/lloydsmart/aruba-cert-renewer
      IS_GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
      PUBLISH_LATEST: ${{ needs.verify.outputs.publish_latest }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TESTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
      VERIFIED_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}

    steps:
      - name: Validate verified release metadata
        shell: bash
        run: |
          set -euo pipefail

          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            printf '%s\n' 'The release event contains an invalid tag.' >&2
            exit 1
          fi

          if [[ "$VERIFIED_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            printf '%s\n' 'The verified release tag does not match the release event.' >&2
            exit 1
          fi

          expected_artifact_name="aruba-cert-renewer-${RELEASE_TAG}-candidate"
          if [[ "$CANDIDATE_ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            printf '%s\n' 'The candidate artifact name is invalid.' >&2
            exit 1
          fi

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'The verified release commit is invalid.' >&2
            exit 1
          fi

          if [[ ! "$TESTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'The verified image ID is invalid.' >&2
            exit 1
          fi

          if [[ "$PUBLISH_LATEST" != 'true' &&
                "$PUBLISH_LATEST" != 'false' ]]; then
            printf '%s\n' 'The publish_latest value is invalid.' >&2
            exit 1
          fi

          if [[ "$IS_GITHUB_PRERELEASE" != 'true' &&
                "$IS_GITHUB_PRERELEASE" != 'false' ]]; then
            printf '%s\n' 'The release prerelease value is invalid.' >&2
            exit 1
          fi

          expected_publish_latest=true
          if [[ "$IS_GITHUB_PRERELEASE" == 'true' ||
                "$RELEASE_TAG" == *-* ]]; then
            expected_publish_latest=false
          fi

          if [[ "$PUBLISH_LATEST" != "$expected_publish_latest" ]]; then
            printf '%s\n' 'The publish_latest value is inconsistent with the release.' >&2
            exit 1
          fi

      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate
          digest-mismatch: error

      - name: Verify and load release candidate
        shell: bash
        run: |
          set -euo pipefail

          handoff_directory="$RUNNER_TEMP/release-candidate"
          image_archive="$handoff_directory/release-candidate.tar"
          archive_checksum="$handoff_directory/release-candidate.tar.sha256"
          image_id_metadata="$handoff_directory/tested-image-id.txt"
          release_sbom="$handoff_directory/release-sbom.spdx.json"

          for artifact_file in \
            "$image_archive" \
            "$archive_checksum" \
            "$image_id_metadata" \
            "$release_sbom"; do
            if [[ ! -f "$artifact_file" || -L "$artifact_file" ]]; then
              printf '%s\n' 'The candidate artifact contains a missing or invalid file.' >&2
              exit 1
            fi
          done

          if [[ ! -s "$image_archive" || ! -s "$release_sbom" ]]; then
            printf '%s\n' 'The candidate image archive or SBOM is empty.' >&2
            exit 1
          fi

          checksum_metadata=$(<"$archive_checksum")
          if [[ ! "$checksum_metadata" =~ ^[0-9a-f]{64}[[:space:]][[:space:]]release-candidate\.tar$ ]]; then
            printf '%s\n' 'The candidate archive checksum metadata is invalid.' >&2
            exit 1
          fi

          (
            cd "$handoff_directory"
            sha256sum --check --strict release-candidate.tar.sha256
          )

          mapfile -t recorded_image_ids <"$image_id_metadata"
          if (( ${#recorded_image_ids[@]} != 1 )); then
            printf '%s\n' 'The candidate image-ID metadata must contain exactly one line.' >&2
            exit 1
          fi

          recorded_image_id=${recorded_image_ids[0]}
          if [[ ! "$recorded_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'The candidate image-ID metadata is invalid.' >&2
            exit 1
          fi

          if [[ "$recorded_image_id" != "$TESTED_IMAGE_ID" ]]; then
            printf '%s\n' 'The candidate image ID does not match the verification output.' >&2
            exit 1
          fi

          docker image load --input "$image_archive"

          loaded_image_id=$(docker image inspect --format '{{.Id}}' \
            "$recorded_image_id")
          if [[ "$loaded_image_id" != "$TESTED_IMAGE_ID" ]]; then
            printf 'Loaded image ID mismatch: expected %s, got %s\n' \
              "$TESTED_IMAGE_ID" "$loaded_image_id" >&2
            exit 1
          fi

      - name: Tag and verify loaded tested image
        shell: bash
        run: |
          set -euo pipefail

          release_references=(
            "$IMAGE_NAME:$RELEASE_TAG"
            "$IMAGE_NAME:sha-$COMMIT_SHA"
          )
          if [[ "$PUBLISH_LATEST" == 'true' ]]; then
            release_references+=("$IMAGE_NAME:latest")
          fi

          for reference in "${release_references[@]}"; do
            docker image tag "$TESTED_IMAGE_ID" "$reference"
          done

          for reference in "${release_references[@]}"; do
            tagged_image_id=$(docker image inspect --format '{{.Id}}' \
              "$reference")
            if [[ "$tagged_image_id" != "$TESTED_IMAGE_ID" ]]; then
              printf 'Image ID mismatch for %s: expected %s, got %s\n' \
                "$reference" "$TESTED_IMAGE_ID" "$tagged_image_id" >&2
              exit 1
            fi
          done

      - name: Log in to GHCR
        id: login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password-stdin

      - name: Publish tested image
        run: |
          set -euo pipefail

          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "$IMAGE_NAME:sha-$COMMIT_SHA"
          if [[ "$PUBLISH_LATEST" == 'true' ]]; then
            docker push "$IMAGE_NAME:latest"
          fi

      - name: Resolve published image digest
        id: published
        shell: bash
        run: |
          set -euo pipefail

          published_manifest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:$RELEASE_TAG" \
            --format '{{.Manifest}}')
          published_digest=$(awk '$1 == "Digest:" { print $2; exit }' \
            <<<"$published_manifest")

          if [[ ! "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Unexpected published image digest: %s\n' "$published_digest" >&2
            exit 1
          fi

          docker buildx imagetools inspect \
            "$IMAGE_NAME@$published_digest" >/dev/null

          docker pull "$IMAGE_NAME@$published_digest" >/dev/null
          published_image_id=$(docker image inspect --format '{{.Id}}' \
            "$IMAGE_NAME@$published_digest")
          if [[ "$published_image_id" != "$TESTED_IMAGE_ID" ]]; then
            printf 'Published image ID mismatch: expected %s, got %s\n' \
              "$TESTED_IMAGE_ID" "$published_image_id" >&2
            exit 1
          fi

          printf 'digest=%s\n' "$published_digest" >>"$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.published.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release-candidate/release-sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: ${{ always() && steps.login.outcome != 'skipped' }}
        run: docker logout ghcr.io
