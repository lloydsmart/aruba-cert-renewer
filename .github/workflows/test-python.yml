name: Python tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.in'
      - 'requirements*.txt'
      - 'scripts/compile-requirements.sh'
      - '.github/workflows/test-python.yml'

  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.in'
      - 'requirements*.txt'
      - 'scripts/compile-requirements.sh'
      - '.github/workflows/test-python.yml'

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: pytest

  locks:
    name: Dependency lock freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Install lock-generation tools
        run: python -m pip install --require-hashes -r requirements-tools.txt

      - name: Regenerate dependency locks
        run: ./scripts/compile-requirements.sh

      - name: Verify dependency locks are current
        run: |
          git diff --exit-code -- \
            requirements.txt \
            requirements-dev.txt \
            requirements-tools.txt
